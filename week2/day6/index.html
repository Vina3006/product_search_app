<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Search App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛍️ Product Search App</h1>
        <p>Products fetched from a real API</p>
    </header>

    <main>

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a product..."
            >

            <button id="searchButton">
                Search
            </button>

        </section>

        <p id="message"></p>

        <section id="productResults" class="product-grid">
           
        </section>

    </main>

    <footer>
        <p>Day 6 — APIs | ZoyaSofts Internship</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
